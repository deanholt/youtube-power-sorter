<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Playlist Power Sorter & Player</title>
    <meta name="version" content="1.2.0" />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: Roboto, Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #0f0f0f;
        color: #fff;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      /* Top Control Bar */
      .top-bar {
        background-color: #212121;
        padding: 15px 20px;
        display: flex;
        gap: 15px;
        align-items: center;
        border-bottom: 1px solid #3d3d3d;
        z-index: 10;
      }

      .branding {
        display: flex;
        align-items: center;
        margin-right: 15px;
      }
      .branding h2 {
        margin: 0;
        font-size: 18px;
        font-weight: bold;
        white-space: nowrap;
      }

      .version-pill {
        background-color: #e6f4ea;
        color: #137333;
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 12px;
        vertical-align: middle;
        margin-left: 10px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .settings-icon {
        margin-left: 10px;
        color: #aaa;
        cursor: pointer;
        transition:
          color 0.2s,
          transform 0.2s;
        font-size: 20px;
      }
      .settings-icon:hover {
        color: #fff;
        transform: rotate(45deg);
      }

      /* Sliding Drawer for Inputs */
      .drawer {
        display: flex;
        gap: 10px;
        flex: 1;
        overflow: hidden;
        transition:
          max-height 0.3s ease-out,
          opacity 0.3s;
        max-height: 50px;
        opacity: 1;
        align-items: center;
      }
      .drawer.hidden {
        max-height: 0;
        opacity: 0;
        pointer-events: none;
        margin: 0;
      }

      .input-group {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1;
      }
      .input-group label {
        font-weight: bold;
        font-size: 14px;
        white-space: nowrap;
        color: #aaa;
      }
      input[type="text"] {
        flex: 1;
        padding: 8px 12px;
        border: 1px solid #303030;
        background: #121212;
        color: #fff;
        border-radius: 4px;
      }
      input[type="text"]:focus {
        outline: 1px solid #3ea6ff;
      }
      button.primary-btn {
        background-color: #cc0000;
        color: white;
        border: none;
        padding: 9px 16px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        white-space: nowrap;
      }
      button.primary-btn:hover {
        background-color: #ff0000;
      }
      button:disabled {
        background-color: #555;
        color: #888;
        cursor: not-allowed;
      }

      /* Modal Styles */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.8);
        z-index: 100;
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      .modal-overlay.active {
        opacity: 1;
        pointer-events: all;
      }
      .modal-content {
        background: #212121;
        padding: 25px;
        border-radius: 8px;
        width: 90%;
        max-width: 450px;
        border: 1px solid #3d3d3d;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      }
      .modal-content h3 {
        margin-top: 0;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .modal-content p {
        color: #aaa;
        font-size: 14px;
        line-height: 1.4;
        margin-bottom: 20px;
      }
      .modal-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 20px;
      }

      .main-layout {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      .player-section {
        flex: 3;
        display: flex;
        flex-direction: column;
        padding: 20px;
        background-color: #0f0f0f;
        min-width: 0;
      }
      .video-container {
        position: relative;
        width: 100%;
        padding-bottom: 56.25%;
        background-color: #000;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      }
      .video-container iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100% !important;
        height: 100% !important;
        border: none;
      }
      .now-playing-title {
        margin-top: 15px;
        font-size: 20px;
        font-weight: bold;
      }
      .now-playing-channel {
        color: #aaa;
        font-size: 14px;
        margin-top: 5px;
      }

      .playlist-section {
        flex: 1;
        min-width: 380px;
        max-width: 450px;
        background-color: #212121;
        border-left: 1px solid #3d3d3d;
        display: flex;
        flex-direction: column;
      }
      .playlist-header {
        padding: 15px;
        border-bottom: 1px solid #3d3d3d;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .header-title {
        font-weight: bold;
        font-size: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      #status {
        font-size: 12px;
        color: #aaa;
        font-weight: normal;
      }

      .sort-controls {
        display: flex;
        gap: 10px;
        align-items: center;
        background: #181818;
        padding: 8px;
        border-radius: 6px;
      }
      .sort-controls select {
        flex: 1;
        padding: 8px;
        background: #212121;
        color: white;
        border: 1px solid #3d3d3d;
        border-radius: 4px;
        cursor: pointer;
      }
      .sort-btn {
        background: #303030;
        color: white;
        border: none;
        padding: 6px 10px;
        border-radius: 4px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .sort-btn:hover {
        background: #404040;
      }
      .sort-btn .material-icons {
        font-size: 20px;
      }

      .video-list {
        list-style: none;
        padding: 0;
        margin: 0;
        overflow-y: auto;
        flex: 1;
      }
      .video-list::-webkit-scrollbar {
        width: 8px;
      }
      .video-list::-webkit-scrollbar-thumb {
        background-color: #717171;
        border-radius: 4px;
      }

      .video-item {
        display: flex;
        padding: 10px 15px;
        cursor: pointer;
        transition: background-color 0.2s;
        border-bottom: 1px solid #303030;
      }
      .video-item:hover {
        background-color: #3d3d3d;
      }
      .video-item.active {
        background-color: #383838;
        border-left: 4px solid #cc0000;
        padding-left: 11px;
      }
      .video-item.active .video-details h3 {
        color: #fff;
      }

      .video-index {
        width: 24px;
        font-size: 12px;
        color: #aaa;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-right: 5px;
      }

      .thumbnail-wrapper {
        position: relative;
        margin-right: 12px;
      }
      .video-item img {
        width: 120px;
        height: 68px;
        object-fit: cover;
        border-radius: 8px;
        pointer-events: none;
      }
      .duration-badge {
        position: absolute;
        bottom: 4px;
        right: 4px;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        font-size: 10px;
        padding: 2px 4px;
        border-radius: 4px;
        font-weight: bold;
        pointer-events: none;
      }

      .video-details {
        pointer-events: none;
        flex: 1;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .video-details h3 {
        margin: 0 0 4px 0;
        font-size: 14px;
        color: #f1f1f1;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .video-details p {
        margin: 0;
        color: #aaa;
        font-size: 12px;
      }
      .video-meta {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 2px;
      }
      /* --- Mobile & Tablet Responsive Layout --- */
      @media (max-width: 1024px) {
        body {
          height: 100dvh;
        }
        .top-bar {
          flex-wrap: wrap;
          padding: 10px 15px;
          gap: 10px;
        }
        .branding {
          width: 100%;
          justify-content: center;
          margin-right: 0;
          margin-bottom: 5px;
        }

        .drawer {
          flex-wrap: wrap;
          max-height: 120px;
          width: 100%;
        }
        .drawer.hidden {
          max-height: 0;
        }
        .input-group {
          flex: 1 1 100%;
        }
        button.primary-btn,
        button#newPlaylistBtn {
          width: 100%;
        }

        .main-layout {
          flex-direction: column;
        }
        .player-section {
          flex: none !important;
          width: 100%;
          padding: 15px;
          box-sizing: border-box;
          z-index: 5;
          box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        .playlist-section {
          flex: 1 1 0 !important;
          max-width: none !important;
          width: 100%;
          min-height: 0;
          border-left: none;
        }
        .sort-controls {
          display: flex;
          gap: 10px;
        }
        .sort-controls select {
          flex: 1;
          margin-bottom: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="settingsModal" class="modal-overlay">
      <div class="modal-content">
        <h3><span class="material-icons">vpn_key</span> API Configuration</h3>
        <p>
          This app runs 100% in your browser. To fetch YouTube data, provide
          your free Google Cloud API key. It will be securely stored in your
          browser's local storage.
        </p>
        <input
          type="text"
          id="modalApiKey"
          placeholder="AIzaSy..."
          style="width: 100%; box-sizing: border-box"
        />
        <div class="modal-actions">
          <button
            class="secondary-btn"
            id="closeModalBtn"
            onclick="closeModal()"
          >
            Cancel
          </button>
          <button class="primary-btn" onclick="saveApiKey()">Save Key</button>
        </div>
      </div>
    </div>

   <div class="top-bar">
    <div class="branding">
        <h2>Power Sorter <span class="version-pill" id="versionDisplay"></span></h2>
        <span class="material-icons settings-icon" onclick="openModal()" title="API Settings">settings</span>
    </div>
    
    <div id="playlistDrawer" class="drawer">
        <div class="input-group">
            <label for="playlistId">Playlist URL:</label>
            <input type="text" id="playlistId" value="PLmWYEDTNOGUJVnzG0gqW4x1-9p7ejEy67">
        </div>
        <button class="primary-btn" id="sortBtn" onclick="fetchPlaylistData()">Load Playlist</button>
    </div>

    <button id="newPlaylistBtn" class="secondary-btn" style="display: none;" onclick="toggleDrawer(true)">Load Different Playlist</button>
</div>

    <div class="main-layout">
      <div class="player-section">
        <div class="video-container">
          <div id="youtubePlayer"></div>
        </div>
        <div id="nowPlayingTitle" class="now-playing-title">Ready to play</div>
        <div id="nowPlayingChannel" class="now-playing-channel">
          Load a playlist to begin
        </div>
      </div>

      <div class="playlist-section">
        <div class="playlist-header">
          <div class="header-title">
            <span>Playlist Content</span>
            <span id="status">Waiting...</span>
          </div>
          <div class="sort-controls">
            <span class="material-icons" style="color: #aaa; font-size: 20px"
              >sort</span
            >
            <select id="sortProperty" onchange="applySort()">
              <option value="default">Playlist Default Order</option>
              <option value="viewCount" selected>View Count</option>
              <option value="dateAdded">Date Added</option>
              <option value="title">Title (A-Z)</option>
              <option value="channel">Channel Name</option>
              <option value="duration">Duration (Length)</option>
            </select>
            <button
              class="sort-btn"
              id="sortDirectionBtn"
              onclick="toggleSortDirection()"
              title="Toggle Direction"
            >
              <span class="material-icons" id="sortDirectionIcon"
                >arrow_downward</span
              >
            </button>
          </div>
        </div>
        <ul id="results" class="video-list"></ul>
      </div>
    </div>

    <script>
// --- Version Injector & Initialization ---
    document.addEventListener("DOMContentLoaded", () => {
        const versionNumber = document.querySelector('meta[name="version"]').content;
        document.getElementById("versionDisplay").innerText = `v${versionNumber}`;
        checkApiKey();
    });

// --- State Management (LocalStorage & UI) ---
    let userApiKey = "";

    function checkApiKey() {
        const savedKey = localStorage.getItem("ytPowerSorter_apiKey");
        if (savedKey) {
            userApiKey = savedKey;
        } else {
            openModal(true); // true = force open, can't be dismissed
        }
    }

    function openModal(force = false) {
        document.getElementById("settingsModal").classList.add("active");
        document.getElementById("modalApiKey").value = userApiKey;
        // If forcing them to enter a key (first time), hide the cancel button
        document.getElementById("closeModalBtn").style.display = force ? "none" : "block";
    }

    function closeModal() {
        document.getElementById("settingsModal").classList.remove("active");
    }

    function saveApiKey() {
        const key = document.getElementById("modalApiKey").value.trim();
        if (key) {
            userApiKey = key;
            localStorage.setItem("ytPowerSorter_apiKey", key);
            closeModal();
        } else {
            alert("Please enter a valid API key.");
        }
    }

    function toggleDrawer(show) {
        const drawer = document.getElementById("playlistDrawer");
        const newBtn = document.getElementById("newPlaylistBtn");
        if (show) {
            drawer.classList.remove("hidden");
            newBtn.style.display = "none";
        } else {
            drawer.classList.add("hidden");
            newBtn.style.display = "block";
        }
    }

    // --- Core Logic ---
      const formatNumber = (num) => parseInt(num).toLocaleString();

      let player;
      let rawPlaylistData = [];
      let sortedPlaylistData = [];
      let currentPlayingVideoId = null;
      let sortDescending = true;

      const tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api";
      const firstScriptTag = document.getElementsByTagName("script")[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

      function onYouTubeIframeAPIReady() {
        player = new window.YT.Player("youtubePlayer", {
          height: "100%",
          width: "100%",
          videoId: "",
          playerVars: {
            autoplay: 1,
            rel: 0,
            modestbranding: 1,
            origin: window.location.origin,
          },
          events: { onStateChange: onPlayerStateChange },
        });
      }

      function onPlayerStateChange(event) {
        if (event.data === window.YT.PlayerState.ENDED) {
          playNextVideo();
        }
      }

      function extractPlaylistId(input) {
        if (!input.includes("youtube.com") && !input.includes("youtu.be"))
          return input;
        const urlParams = new URLSearchParams(new URL(input).search);
        return urlParams.get("list") || input;
      }

      function parseDurationToSeconds(duration) {
        if (!duration) return 0;
        const match = duration.match(/PT(\d+H)?(\d+M)?(\d+S)?/);
        if (!match) return 0;

        const hours = parseInt(match[1]) || 0;
        const minutes = parseInt(match[2]) || 0;
        const seconds = parseInt(match[3]) || 0;
        return hours * 3600 + minutes * 60 + seconds;
      }

      function formatDurationText(totalSeconds) {
        if (totalSeconds === 0) return "LIVE/UKN";
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        if (hours > 0) {
          return `${hours}:${minutes.toString().padStart(2, "0")}:${seconds.toString().padStart(2, "0")}`;
        }
        return `${minutes}:${seconds.toString().padStart(2, "0")}`;
      }

      function playNextVideo() {
        if (!currentPlayingVideoId) return;
        const currentIndex = sortedPlaylistData.findIndex(
          (v) => v.videoId === currentPlayingVideoId,
        );
        if (
          currentIndex !== -1 &&
          currentIndex < sortedPlaylistData.length - 1
        ) {
          playVideo(currentIndex + 1);
        }
      }

      function playVideo(index) {
        if (index < 0 || index >= sortedPlaylistData.length) return;

        const video = sortedPlaylistData[index];
        currentPlayingVideoId = video.videoId;

        if (player && typeof player.loadVideoById === "function") {
          player.loadVideoById(video.videoId);
        } else {
          setTimeout(() => playVideo(index), 500);
          return;
        }

        document.getElementById("nowPlayingTitle").innerText = video.title;
        document.getElementById("nowPlayingChannel").innerText =
          `${video.channel} • ${formatNumber(video.viewCount)} views`;

        updateActiveHighlight();
      }

      function updateActiveHighlight() {
        const allItems = document.querySelectorAll(".video-item");
        allItems.forEach((item) => item.classList.remove("active"));

        const currentIndex = sortedPlaylistData.findIndex(
          (v) => v.videoId === currentPlayingVideoId,
        );
        if (currentIndex !== -1) {
          const activeItem = document.getElementById(
            `video-item-${currentIndex}`,
          );
          if (activeItem) {
            activeItem.classList.add("active");
            activeItem.scrollIntoView({ behavior: "smooth", block: "center" });
          }
        }
      }

      function toggleSortDirection() {
        sortDescending = !sortDescending;
        const icon = document.getElementById("sortDirectionIcon");
        icon.innerText = sortDescending ? "arrow_downward" : "arrow_upward";
        applySort();
      }

      function applySort() {
        const property = document.getElementById("sortProperty").value;

        sortedPlaylistData = [...rawPlaylistData];

        if (property !== "default") {
          sortedPlaylistData.sort((a, b) => {
            let valA = a[property];
            let valB = b[property];

            if (typeof valA === "string") {
              const comp = valA.localeCompare(valB);
              return sortDescending ? comp * -1 : comp;
            }

            return sortDescending ? valB - valA : valA - valB;
          });
        } else {
          if (!sortDescending) sortedPlaylistData.reverse();
        }

        renderPlaylistDOM();
        updateActiveHighlight();
      }

      function renderPlaylistDOM() {
        const resultsEl = document.getElementById("results");
        resultsEl.innerHTML = "";

        sortedPlaylistData.forEach((video, index) => {
          const li = document.createElement("li");
          li.className = "video-item";
          li.id = `video-item-${index}`;
          li.onclick = () => playVideo(index);

          const dateObj = new Date(video.dateAdded);
          const dateString = dateObj.toLocaleDateString(undefined, {
            year: "numeric",
            month: "short",
            day: "numeric",
          });

          li.innerHTML = `
                <div class="video-index">${index + 1}</div>
                <div class="thumbnail-wrapper">
                    <img src="${video.thumbnail}" alt="Thumbnail">
                    <div class="duration-badge">${video.durationText}</div>
                </div>
                <div class="video-details">
                    <h3>${video.title}</h3>
                    <p>${video.channel}</p>
                    <div class="video-meta">
                        <p>${formatNumber(video.viewCount)} views • ${dateString}</p>
                    </div>
                </div>
            `;
          resultsEl.appendChild(li);
        });
      }

      async function fetchPlaylistData() {
if (!userApiKey) {
            openModal(true);
            return;
        }
        const rawPlaylistId = document
          .getElementById("playlistId")
          .value.trim();
        const statusEl = document.getElementById("status");
        const btn = document.getElementById("sortBtn");

if (!rawPlaylistId) {
            alert("Please provide a Playlist ID.");
            return;
        }

        const playlistId = extractPlaylistId(rawPlaylistId);
        btn.disabled = true;
        document.getElementById("results").innerHTML = "";
        rawPlaylistData = [];
        currentPlayingVideoId = null;

        try {
          statusEl.innerText = "Fetching items...";
          let playlistItems = [];
          let nextPageToken = "";

          do {
            let url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=${playlistId}&key=${userApiKey}`;
            if (nextPageToken) url += `&pageToken=${nextPageToken}`;

            const response = await fetch(url);
            const data = await response.json();
            // If API key is rejected by Google, clear it from memory and ask again
                if (data.error) {
                    if (data.error.code === 400 || data.error.code === 403) {
                        localStorage.removeItem("ytPowerSorter_apiKey");
                        userApiKey = "";
                        openModal(true);
                    }
                    throw new Error(data.error.message);
                }

            playlistItems.push(...data.items);
            nextPageToken = data.nextPageToken;
          } while (nextPageToken);

          playlistItems = playlistItems.filter(
            (item) =>
              item.snippet.title !== "Private video" &&
              item.snippet.title !== "Deleted video",
          );

          statusEl.innerText = "Fetching video details...";
          const videoIds = playlistItems.map(
            (item) => item.snippet.resourceId.videoId,
          );
          const videosData = [];

          for (let i = 0; i < videoIds.length; i += 50) {
            const chunk = videoIds.slice(i, i + 50).join(",");
            const statsUrl = `https://www.googleapis.com/youtube/v3/videos?part=statistics,contentDetails&id=${chunk}&key=${userApiKey}`;
            const statsRes = await fetch(statsUrl);
            const statsData = await statsRes.json();
            if (statsData.error) throw new Error(statsData.error.message);
            videosData.push(...statsData.items);
          }

          statusEl.innerText = "Processing data...";
          rawPlaylistData = playlistItems.map((item, index) => {
            const videoId = item.snippet.resourceId.videoId;
            const details = videosData.find((v) => v.id === videoId);

            const rawDuration = details?.contentDetails?.duration || "PT0S";
            const durationSeconds = parseDurationToSeconds(rawDuration);

            return {
              originalIndex: index,
              title: item.snippet.title,
              channel: item.snippet.videoOwnerChannelTitle,
              thumbnail: item.snippet.thumbnails?.medium?.url || "",
              videoId: videoId,
              viewCount: details?.statistics?.viewCount
                ? parseInt(details.statistics.viewCount, 10)
                : 0,
              dateAdded: new Date(item.snippet.publishedAt).getTime(),
              duration: durationSeconds,
              durationText: formatDurationText(durationSeconds),
            };
          });

          statusEl.innerText = `${rawPlaylistData.length} videos loaded.`;

// Success! Tuck the drawer away and show the new button
            toggleDrawer(false);

          applySort();

          if (sortedPlaylistData.length > 0) {
            playVideo(0);
          }
        } catch (error) {
          statusEl.innerText = `Error`;
          console.error(error);
          alert(`Error: ${error.message}`);
        } finally {
          btn.disabled = false;
        }
      }
    </script>
  </body>
</html>
